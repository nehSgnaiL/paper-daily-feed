name: Test paper feeds

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-paper-feeds
  cancel-in-progress: true

jobs:
  test-recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun project
        uses: ./.github/actions/setup-bun

      - name: Restore Transformers.js cache
        uses: actions/cache@v5
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: ${{ runner.os }}-transformers-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-transformers-

      - name: Typecheck
        run: bun run build

      - name: Run recommendation feed in test mode
        env:
          APP_CONFIG: ${{ vars.APP_CONFIG }}
          PAPER_LIMIT: 3
          RUNTIME_DEBUG: false
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL || secrets.EMBEDDING_BASE_URL }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          SENDER: ${{ secrets.SENDER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: bun src/index.ts run
