name: Repository maintenance

on:
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: Send a bilingual maintenance test email
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "37 21 * * 0"

permissions:
  contents: write

concurrency:
  group: repository-maintenance
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: nehSgnaiL/paper-daily-feed
  MAINTENANCE_BRANCH: paper-daily-feed-maintenance

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Keep scheduled workflows active
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin "${MAINTENANCE_BRANCH}" || true

          if git show-ref --verify --quiet "refs/remotes/origin/${MAINTENANCE_BRANCH}"; then
            git switch -C "${MAINTENANCE_BRANCH}" "origin/${MAINTENANCE_BRANCH}"
          else
            git switch -c "${MAINTENANCE_BRANCH}"
          fi

          git commit --allow-empty -m "ci: keep scheduled workflows active"
          git push origin "${MAINTENANCE_BRANCH}"

  sync:
    if: ${{ github.repository != 'nehSgnaiL/paper-daily-feed' || inputs.send_test_notification }}
    needs: keepalive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync fork from upstream
        id: sync
        if: ${{ github.repository != 'nehSgnaiL/paper-daily-feed' && !inputs.send_test_notification }}
        env:
          SYNC_TOKEN: ${{ secrets.MAINTENANCE_SYNC_TOKEN || github.token }}
          CAN_SYNC_WORKFLOW_FILES: ${{ secrets.MAINTENANCE_SYNC_TOKEN != '' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags origin main
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

          set_manual_action() {
            local reason="$1"
            local details="${2:-}"
            local delimiter="maintenance-${RANDOM}-$(date +%s)"

            echo "manual_reason=${reason}" >> "$GITHUB_OUTPUT"
            {
              echo "manual_details<<${delimiter}"
              echo "${details}"
              echo "${delimiter}"
            } >> "$GITHUB_OUTPUT"
          }

          write_workflow_sync_steps() {
            echo "### What to do next"
            echo
            echo "This needs a one-time GitHub setup because GitHub does not let the default workflow token update workflow files."
            echo
            echo "1. Open this token page: https://github.com/settings/personal-access-tokens/new"
            echo "2. Choose this fork as the only repository: \`${GITHUB_REPOSITORY}\`."
            echo "3. Give the token these repository permissions: **Contents: Read and write** and **Workflows: Read and write**."
            echo "4. Create the token and copy it."
            echo "5. Open this secret page: https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions/new"
            echo "6. Set **Name** to \`MAINTENANCE_SYNC_TOKEN\`."
            echo "7. Paste the token into **Secret**, then save."
            echo "8. Open this workflow page: https://github.com/${GITHUB_REPOSITORY}/actions/workflows/maintenance.yml"
            echo "9. Click **Run workflow**."
            echo
            echo "Expected result: the next run says **Auto-sync completed** and your fork \`main\` has no extra sync commit."
          }

          origin_main_sha="$(git rev-parse origin/main)"
          upstream_main_sha="$(git rev-parse upstream/main)"
          merge_base_sha="$(git merge-base origin/main upstream/main)"
          upstream_workflow_file_changes="$(git log --format= --name-only origin/main..upstream/main -- .github/workflows | sed '/^$/d' | sort -u)"
          fork_workflow_file_changes="$(git log --format= --name-only upstream/main..origin/main -- .github/workflows | sed '/^$/d' | sort -u)"

          if [ "${origin_main_sha}" = "${upstream_main_sha}" ]; then
            {
              echo "### Auto-sync checked"
              echo
              echo "The fork main branch already points at \`${UPSTREAM_REPOSITORY}:main\`."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          if git merge-base --is-ancestor upstream/main origin/main; then
            {
              echo "### Auto-sync checked"
              echo
              echo "The fork main branch already contains \`${UPSTREAM_REPOSITORY}:main\`."
              echo "Your fork also has custom commits after upstream. No sync commit was created."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          if [ "${CAN_SYNC_WORKFLOW_FILES}" != "true" ] && { [ -n "${upstream_workflow_file_changes}" ] || [ -n "${fork_workflow_file_changes}" ]; }; then
            {
              echo "### Workflow updates skipped"
              echo
              echo "No action was taken on \`main\`."
              echo
              echo "The fork main branch cannot be updated because the commit range includes workflow file changes."
              echo "GitHub blocks workflow-file updates from the default workflow token."
              echo "No partial sync was pushed, so \`main\` stays clean."
              echo
              if [ -n "${upstream_workflow_file_changes}" ]; then
                echo "Workflow files changed upstream:"
                echo
                echo "\`\`\`"
                echo "${upstream_workflow_file_changes}"
                echo "\`\`\`"
                echo
              fi
              if [ -n "${fork_workflow_file_changes}" ]; then
                echo "Workflow files changed in this fork:"
                echo
                echo "\`\`\`"
                echo "${fork_workflow_file_changes}"
                echo "\`\`\`"
                echo
              fi
              echo
              write_workflow_sync_steps
            } >> "$GITHUB_STEP_SUMMARY"

            workflow_details="$(printf '%s\n%s' "${upstream_workflow_file_changes}" "${fork_workflow_file_changes}" | sed '/^$/d' | sort -u)"
            set_manual_action "workflow-permission" "${workflow_details}"
            echo "::warning title=Auto-sync skipped::Open the job summary for step-by-step setup. Add MAINTENANCE_SYNC_TOKEN, then rerun this workflow."
            exit 0
          fi

          target_ref="upstream/main"
          result_message="The fork main branch now points exactly at \`${UPSTREAM_REPOSITORY}:main\`."

          if [ "${merge_base_sha}" != "${origin_main_sha}" ]; then
            git switch -C main origin/main

            if ! git rebase upstream/main; then
              conflicted_files="$(git diff --name-only --diff-filter=U | sort -u || true)"
              git rebase --abort || true

              {
                echo "### Auto-sync needs your help"
                echo
                echo "No action was taken on \`main\`."
                echo "Your fork has custom commits, and Git could not place them on top of the latest upstream version automatically."
                echo
                if [ -n "${conflicted_files}" ]; then
                  echo "Files needing attention:"
                  echo
                  echo "\`\`\`"
                  echo "${conflicted_files}"
                  echo "\`\`\`"
                  echo
                fi
                echo "### What to do next"
                echo
                echo "1. Open your fork's branches page: https://github.com/${GITHUB_REPOSITORY}/branches"
                echo "2. Create or keep a separate branch for your custom work."
                echo "3. Sync \`main\` with upstream from GitHub, or rerun this workflow after resolving the listed files."
                echo "4. Re-apply your custom changes on the separate branch, then test the daily feed."
                echo
                echo "For non-technical users: copy the file list above and ask a maintainer to resolve the custom changes against the latest upstream version."
              } >> "$GITHUB_STEP_SUMMARY"

              set_manual_action "rebase-conflict" "${conflicted_files}"
              echo "::warning title=Auto-sync needs help::Open the job summary for step-by-step recovery."
              exit 0
            fi

            target_ref="HEAD"
            result_message="The fork main branch now contains latest \`${UPSTREAM_REPOSITORY}:main\`, with your custom commits replayed on top."
          fi

          if ! git push --force-with-lease="refs/heads/main:${origin_main_sha}" origin "${target_ref}:refs/heads/main"; then
            {
              echo "### Auto-sync failed"
              echo
              echo "The workflow could not update \`main\`."
              echo "Most likely cause: branch protection blocks force pushes, or another update changed \`main\` during this run."
              echo
              echo "### What to do next"
              echo
              echo "1. Open branch settings: https://github.com/${GITHUB_REPOSITORY}/settings/branches"
              echo "2. Check whether \`main\` has a branch protection rule."
              echo "3. If this fork is only used for the daily feed, allow force pushes on \`main\` or remove protection from \`main\`."
              echo "4. Open this workflow page: https://github.com/${GITHUB_REPOSITORY}/actions/workflows/maintenance.yml"
              echo "5. Click **Run workflow**."
              echo
              echo "If you use \`main\` for your own work, keep that work in commits so this workflow can rebase them on top of upstream."
            } >> "$GITHUB_STEP_SUMMARY"

            set_manual_action "push-failed" "main branch push rejected"
            echo "::error title=Auto-sync failed::Open the job summary for step-by-step recovery."
            exit 1
          fi

          {
            echo "### Auto-sync completed"
            echo
            echo "${result_message}"
            echo "No sync commit was created."
            if [ "${CAN_SYNC_WORKFLOW_FILES}" = "true" ]; then
              echo "Workflow files were included because \`MAINTENANCE_SYNC_TOKEN\` is configured."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare maintenance email test
        id: test
        if: ${{ inputs.send_test_notification }}
        run: |
          echo "manual_reason=test" >> "$GITHUB_OUTPUT"
          echo "manual_details=" >> "$GITHUB_OUTPUT"

      - name: Setup Bun project for maintenance notification
        if: ${{ always() && (steps.sync.outputs.manual_reason != '' || steps.test.outputs.manual_reason != '') }}
        uses: ./.github/actions/setup-bun

      - name: Send bilingual maintenance notification
        if: ${{ always() && (steps.sync.outputs.manual_reason != '' || steps.test.outputs.manual_reason != '') }}
        env:
          MAINTENANCE_REASON: ${{ steps.sync.outputs.manual_reason || steps.test.outputs.manual_reason }}
          MAINTENANCE_DETAILS: ${{ steps.sync.outputs.manual_details || steps.test.outputs.manual_details }}
          MAINTENANCE_REPOSITORY: ${{ github.repository }}
          MAINTENANCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SENDER: ${{ secrets.SENDER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: bun src/index.ts notify-maintenance
