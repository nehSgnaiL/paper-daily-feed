name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun project
        uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: bun run build

      - name: Email render compatibility tests
        run: bun run test:email

      - name: Test
        run: bun test

      - name: Audit dependencies
        run: bun audit
