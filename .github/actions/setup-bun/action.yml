name: Setup Bun project
description: Install the pinned Bun runtime, restore its package cache, and install locked dependencies.

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Restore Bun package cache
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-1.3.14-

    - name: Install dependencies
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL: skip
      run: bun ci
